<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SAYge Pros — Admin View</title>
<style>
  :root{
    --teal:#136E6B; --living:#1C8B83; --mint:#DCEFEA; --gold:#F0B53C;
    --appbg:#F6F7F4; --card:#FFFFFF; --border:#E7E9E7;
    --text:#23302E; --text2:#5C665F; --muted:#8A938C; --error:#C0584F;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--appbg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 72px}
  .brand{font-size:20px;font-weight:800;color:var(--teal)}
  h1{font-size:24px;margin:4px 0 2px}
  .sub{color:var(--text2);font-size:14px;margin:0 0 18px}
  /* gate */
  .gate{max-width:400px;margin:12vh auto 0;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:28px}
  input[type=text],input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--border);
    border-radius:10px;background:var(--appbg);font-size:16px;color:var(--text);font-family:inherit}
  input:focus{outline:none;border-color:var(--teal);background:#fff}
  .btn{border:none;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;
    font-family:inherit;background:var(--teal);color:#fff;width:100%}
  .btn.secondary{background:var(--mint);color:var(--teal);width:auto;padding:9px 14px;font-size:14px}
  /* summary */
  .stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;flex:1;min-width:120px}
  .stat .n{font-size:22px;font-weight:800;color:var(--teal)}
  .stat .l{font-size:12px;color:var(--text2)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:180px}
  /* cards */
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
  .head{display:flex;gap:14px;align-items:flex-start}
  .avatar{width:60px;height:60px;border-radius:50%;flex:0 0 auto;background:var(--mint);
    border:2px solid var(--gold);overflow:hidden;display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--teal);font-size:20px}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who{flex:1;min-width:0}
  .name{font-size:18px;font-weight:800}
  .role{color:var(--text2);font-size:14px}
  .email{color:var(--muted);font-size:13px;word-break:break-all}
  .edited{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
  .neveropened{color:var(--error);font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
  .chip{background:var(--appbg);border:1px solid var(--border);border-radius:999px;padding:4px 10px;
    font-size:12px;font-weight:600;color:var(--teal)}
  .row{margin-top:10px;font-size:14px}
  .row .k{font-weight:700;color:var(--text2);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
  .row a{color:var(--teal);word-break:break-all}
  .bio{font-size:14px;color:var(--text);margin-top:8px;white-space:pre-wrap}
  .bio.clip{max-height:66px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
  .more{background:none;border:none;color:var(--teal);font-weight:600;cursor:pointer;font-size:13px;padding:4px 0 0}
  .reslist{margin-top:10px}
  .res{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
  .kind{font-size:10px;font-weight:800;color:var(--teal);background:var(--mint);border-radius:999px;
    padding:2px 8px;text-transform:uppercase;flex:0 0 auto}
  .miss{display:inline-block;background:#fdeceb;color:var(--error);border-radius:999px;padding:2px 9px;
    font-size:11px;font-weight:700;margin:8px 6px 0 0}
  .hidden{display:none}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate" class="gate">
  <div class="brand">SAYge</div>
  <h1>Pros — Admin View</h1>
  <p class="sub">Enter the admin passcode to view Pro profiles.</p>
  <input type="password" id="pass" placeholder="Passcode" />
  <div style="height:12px"></div>
  <button class="btn" id="enter">View</button>
</div>

<!-- DASHBOARD -->
<div id="dash" class="wrap hidden">
  <div class="brand">SAYge</div>
  <h1>Pros — Admin View</h1>
  <p class="sub" id="subline">Loading…</p>

  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search by name, email, or specialty…" />
    <button class="btn secondary" id="refresh">↻ Refresh</button>
  </div>
  <div id="list"></div>
</div>

<script>
(function(){
  "use strict";
  var SUPA="https://bgtbcvwjxoauhpilwbiy.supabase.co";
  var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGJjdndqeG9hdWhwaWx3Yml5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgxNzkyNTEsImV4cCI6MjA4Mzc1NTI1MX0.bijwt4LIaHg4m0IqjSCHjTgBhtPL0rVZvGrobsBblZI";
  var PASSCODE="sayge-admin";  // change anytime; light gate only
  var H={apikey:ANON,Authorization:"Bearer "+ANON};
  var $=function(id){return document.getElementById(id);};
  var allPros=[];

  function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
  function when(iso){
    if(!iso) return "—";
    var d=new Date(iso), now=new Date(), diff=(now-d)/1000;
    if(diff<3600) return Math.max(1,Math.round(diff/60))+" min ago";
    if(diff<86400) return Math.round(diff/3600)+" hr ago";
    if(diff<86400*7) return Math.round(diff/86400)+" days ago";
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  }
  function initials(name){return (name||"?").split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}

  function load(){
    $("subline").textContent="Loading…";
    Promise.all([
      fetch(SUPA+"/rest/v1/sayge_pro_profiles?select=*&order=updated_at.desc",{headers:H}).then(function(r){return r.json();}),
      fetch(SUPA+"/rest/v1/profile_resources?select=pro_id,resource_title,resource_type",{headers:H}).then(function(r){return r.json();})
    ]).then(function(res){
      var pros=res[0]||[], resources=res[1]||[];
      var byPro={};
      resources.forEach(function(r){ (byPro[r.pro_id]=byPro[r.pro_id]||[]).push(r); });
      pros.forEach(function(p){ p._res=byPro[p.id]||[]; });
      allPros=pros;
      renderStats(); render();
    }).catch(function(e){ $("subline").textContent="Could not load ("+e.message+")"; });
  }

  function renderStats(){
    var n=allPros.length;
    var photo=allPros.filter(function(p){return p.photo_url;}).length;
    var booking=allPros.filter(function(p){return p.booking_url;}).length;
    var bio=allPros.filter(function(p){return p.bio;}).length;
    var content=allPros.filter(function(p){return p._res.length;}).length;
    var opened=allPros.filter(function(p){return p.last_opened_at;}).length;
    var s=[["Pros",n],["Opened link",opened],["Never opened",n-opened],["With photo",photo],["With booking link",booking],["Added content",content]];
    $("stats").innerHTML=s.map(function(x){return '<div class="stat"><div class="n">'+x[1]+'</div><div class="l">'+x[0]+'</div></div>';}).join("");
    $("subline").textContent="Sorted by most recently edited. Live from the database.";
  }

  function card(p){
    var av=p.photo_url ? '<img src="'+esc(p.photo_url)+'" alt="">' : esc(initials(p.name));
    var chips=(p.specialties||[]).map(function(s){return '<span class="chip">'+esc(s)+'</span>';}).join("");
    var miss=[];
    if(!p.photo_url) miss.push("No photo");
    if(!p.booking_url) miss.push("No booking link");
    if(!p.bio) miss.push("No bio");
    var missHtml=miss.map(function(m){return '<span class="miss">'+m+'</span>';}).join("");
    var booking=p.booking_url?'<div class="row"><div class="k">Booking</div><a href="'+esc(p.booking_url)+'" target="_blank" rel="noopener">'+esc(p.booking_url)+'</a></div>':"";
    var video=p.video_url?'<div class="row"><div class="k">Intro video</div><a href="'+esc(p.video_url)+'" target="_blank" rel="noopener">'+esc(p.video_url)+'</a></div>':"";
    var resHtml="";
    if(p._res.length){
      resHtml='<div class="reslist"><div class="k">Content ('+p._res.length+')</div>'+p._res.map(function(r){
        return '<div class="res"><span class="kind">'+esc(r.resource_type)+'</span> '+esc(r.resource_title)+'</div>';
      }).join("")+'</div>';
    }
    var bioHtml=p.bio?'<div class="bio clip" id="bio-'+p.id+'">'+esc(p.bio)+'</div><button class="more" data-bio="'+p.id+'">Show more</button>':"";
    return '<div class="card">'
      +'<div class="head">'
        +'<div class="avatar">'+av+'</div>'
        +'<div class="who"><div class="name">'+esc(p.name)+'</div>'
          +'<div class="role">'+esc(p.role_title||"")+'</div>'
          +'<div class="email">'+esc(p.email)+'</div></div>'
        +'<div class="edited">'
          +(p.last_opened_at?'opened '+when(p.last_opened_at):'<span class="neveropened">Never opened</span>')
          +'<br>edited '+when(p.updated_at)
          +'</div>'
      +'</div>'
      +(chips?'<div class="chips">'+chips+'</div>':"")
      +bioHtml+booking+video+resHtml
      +(missHtml?'<div>'+missHtml+'</div>':"")
      +'</div>';
  }

  function render(){
    var q=($("search").value||"").toLowerCase().trim();
    var list=allPros.filter(function(p){
      if(!q) return true;
      var hay=((p.name||"")+" "+(p.email||"")+" "+(p.role_title||"")+" "+(p.specialties||[]).join(" ")).toLowerCase();
      return hay.indexOf(q)!==-1;
    });
    $("list").innerHTML=list.length?list.map(card).join(""):'<p class="muted">No matches.</p>';
    [].forEach.call(document.querySelectorAll(".more"),function(b){
      b.onclick=function(){
        var el=$("bio-"+b.getAttribute("data-bio"));
        if(el.classList.contains("clip")){el.classList.remove("clip");b.textContent="Show less";}
        else{el.classList.add("clip");b.textContent="Show more";}
      };
    });
  }

  // gate
  function unlock(){
    if($("pass").value.trim().toLowerCase()===PASSCODE){
      $("gate").className="gate hidden"; $("dash").className="wrap"; load();
    } else { $("pass").value=""; $("pass").placeholder="Wrong passcode — try again"; }
  }
  $("enter").onclick=unlock;
  $("pass").addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
  $("search").addEventListener("input",render);
  $("refresh").onclick=load;
})();
</script>
</body>
</html>
